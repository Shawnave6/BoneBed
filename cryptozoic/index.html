<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cryptozoic — Guess the Prehistoric Creature</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game">

    <a class="back-btn" href="../index.html">← Menu</a>
    <header class="banner">
      <h1>Cryptozoic</h1>
      <p class="subtitle">Guess the prehistoric creature</p>
    </header>

    <main class="board">

      <div class="top-row">
        <div class="stat-box timer-box">
          <span class="stat-value" id="timer">100</span>
          <span class="stat-label">Time</span>
        </div>
        <button class="dig-btn" id="digBtn" aria-label="Dig for a new creature" title="Skip to a new creature">
          <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
            <line x1="27" y1="9" x2="12" y2="34" stroke="#d9b77a" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M15 12 Q27 2 37 15 L33 17.5 Q27 10 18 16 Z" fill="#c3ccce"/>
          </svg>
        </button>
      </div>

      <div class="clue-panel" id="cluePanel">
        <div class="clue-row" data-field="period">
          <span class="clue-label">Period</span>
          <span class="clue-value" id="val-period"></span>
        </div>
        <div class="clue-row locked" data-field="habitat">
          <span class="clue-label">Habitat</span>
          <span class="clue-value" id="val-habitat"></span>
        </div>
        <div class="clue-row locked" data-field="diet">
          <span class="clue-label">Diet</span>
          <span class="clue-value" id="val-diet"></span>
        </div>
        <div class="clue-row locked" data-field="family">
          <span class="clue-label">Family</span>
          <span class="clue-value" id="val-family"></span>
        </div>
        <div class="clue-row locked" data-field="defence">
          <span class="clue-label">Defence</span>
          <span class="clue-value" id="val-defence"></span>
        </div>
      </div>

      <div class="controls-row">
        <div class="stat-box">
          <span class="stat-label">Guesses</span>
          <span class="stat-value" id="guessCount">0</span>
        </div>
        <button class="stat-box hint-btn" id="hintBtn">
          <span class="stat-label">Hint</span>
          <span class="stat-value" id="hintCount">4/4</span>
        </button>
      </div>

      <form class="guess-form" id="guessForm" autocomplete="off">
        <input
          type="text"
          id="guessInput"
          placeholder="Type the creature's name..."
          aria-label="Your guess"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
        />
        <button type="submit" class="submit-btn" aria-label="Submit guess">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M5 3 L17 10 L5 17 Z" fill="#2a1d10"/>
          </svg>
        </button>
        <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      </form>

      <button class="give-up-btn" id="giveUpBtn">Give up</button>

      <div class="message-area">
        <p class="message" id="message" aria-live="polite"></p>
        <div class="advance-bar-track" id="advanceTrack">
          <div class="advance-bar" id="advanceBar"></div>
        </div>
      </div>

    </main>

    <div class="trees" aria-hidden="true">
      <svg viewBox="0 0 1440 160" preserveAspectRatio="none">
        <path class="ridge-back" d="M0 90 C120 40 220 30 340 70 C460 110 560 40 700 46 C840 52 920 110 1060 84 C1180 62 1300 28 1440 70 L1440 160 L0 160 Z"/>
        <path class="ridge-mid" d="M0 118 C140 84 260 100 380 116 C520 134 600 86 760 92 C900 98 980 138 1120 122 C1240 108 1340 86 1440 108 L1440 160 L0 160 Z"/>
        <path class="ridge-front" d="M0 142 C160 124 300 138 460 146 C620 154 720 126 880 128 C1040 130 1120 154 1260 148 C1350 144 1400 134 1440 138 L1440 160 L0 160 Z"/>
        <g class="ferns">
          <path d="M120 160 Q110 118 84 104 Q112 110 124 136 Q128 108 152 92 Q134 116 132 160 Z"/>
          <path d="M1290 160 Q1282 124 1258 110 Q1284 114 1296 138 Q1302 114 1324 100 Q1308 120 1306 160 Z"/>
          <path d="M700 160 Q694 136 676 126 Q696 128 704 146 Q710 128 726 120 Q714 134 712 160 Z"/>
        </g>
      </svg>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
