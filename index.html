<body>


    <div class="backdrop" aria-hidden="true">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">

                <g id="frond">
                    <path class="fossil-line" d="M0 0 Q10 -80 60 -150"/>
                    <use href="#leaf" transform="translate(3.9 -23.8) rotate(-42) scale(1.3)"/>
                    <use href="#leaf" transform="translate(3.9 -23.8) rotate(58) scale(1.3)"/>
                    <use href="#leaf" transform="translate(9.6 -47.1) rotate(-39) scale(1.25)"/>

                    <use href="#leaf" transform="translate(60 -150) rotate(35) scale(.6)"/>
                </g>

               
                <g id="print" class="fossil">
                    <ellipse cx="0" cy="-30" rx="6" ry="15"/>

                    <ellipse cx="14" cy="-20" rx="5" ry="13" transform="rotate(32 14 -20)"/>

                <g id="bone" class="fossil">
                    <rect x="-40" y="-4" width="80" height="8" rx="4"/>
                    <circle cx="-42" cy="-6" r="7"/>
                    <circle cx="-42" cy="6" r="7"/>
                    <circle cx="42" cy="-6" r="7"/>
                    <circle cx="42" cy="6" r="7"/>

                <g id="trilo" class="fossil-line">
                    <path d="M-30 -22 Q0 -52 30 -22 Q36 -10 28 0 L-28 0 Q-36 -10 -30 -22Z"/>
                    <path d="M-28 4 L28 4 L25 44 Q0 62 -25 44Z"/>

                    <path d="M-27 13 H27"/>
                    <path d="M-26 22 H26"/>
                    <path d="M-26 31 H26"/>
                    <path d="M-25 40 H25"/>
                </g>
            </defs>

          
            <path class="strata-a" d="M0 150 C240 130 480 175 720 150 S1200 125 1440 155 V300 C1200 280 960 322 720 300 S240 285 0 305 Z"/>
            <path class="strata-b" d="M0 380 C260 400 500 360 760 385 S1200 405 1440 380 V470 C1180 490 940 450 700 472 S240 490 0 468 Z"/>

            <path class="strata-b" d="M0 780 C260 800 500 765 740 785 S1200 800 1440 780 V900 H0 Z"/>

            <g transform="translate(150 290) scale(1.7)">
                <path class="fossil-line" stroke-width="7" d="M0 0 a8 8 0 0 1 16 0 a12 12 0 0 1 -24 0 a18 18 0 0 1 36 0 a27 27 0 0 1 -54 0 a40 40 0 0 1 80 0 a60 60 0 0 1 -120 0 a90 90 0 0 1 180 0"/>

            <use href="#bone" transform="translate(120 470) rotate(20) scale(1.1)"/>
            <use href="#print" transform="translate(90 800) rotate(-8) scale(1.1)"/>
            <use href="#print" transform="translate(145 740) rotate(-2) scale(1.1)"/>
            <use href="#print" transform="translate(90 680) rotate(6) scale(1.1)"/>
            <use href="#print" transform="translate(145 620) rotate(0) scale(1.1)"/>
            <use href="#print" transform="translate(92 560) rotate(8) scale(1.1)"/>

            
            <use href="#trilo" transform="translate(1330 210) rotate(28) scale(1.5)"/>
            <use href="#bone" transform="translate(1270 390) rotate(-25) scale(1.1)"/>
            <use href="#frond" transform="translate(1360 780) rotate(-20) scale(2.1)"/>

    <main class="menu">
