<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bonebed - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <a class="back" href="../index.html">&larr; Menu</a>
        <h1>The Bonebed Admin</h1>
        <button id="logoutBtn" class="ghost" hidden>Log out</button>
    </header>

    <main>
        <div id="status" class="status" role="status" aria-live="polite"></div>

        <!-- LOGIN -->
        <section id="loginPanel" class="card narrow">
            <h2>Admin login</h2>
            <p class="hint">Enter the admin password to manage dinosaur records.</p>
            <form id="loginForm">
                <label for="keyInput">Password</label>
                <div class="password-row">
                    <input type="password" id="keyInput" autocomplete="off" required>
                    <button type="button" id="togglePw" class="ghost" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
                <button type="submit" id="loginBtn">Log in</button>
            </form>
        </section>

        <!-- ADMIN PANEL -->
        <section id="adminPanel" hidden>
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="Search records...">
                <button id="searchBtn">Search</button>
                <button id="showAllBtn" class="ghost">Show all</button>
                <button id="addBtn" class="accent">+ Add dinosaur</button>
            </div>
            <p id="count" class="hint"></p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Period</th><th>Diet</th><th>Habitat</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ADD / EDIT FORM -->
    <dialog id="formDialog">
        <form id="recordForm">
            <h2 id="formTitle">Add dinosaur</h2>
            <div id="fields" class="fields"></div>
            <div class="actions">
                <button type="button" id="cancelBtn" class="ghost">Cancel</button>
                <button type="submit" id="saveBtn" class="accent">Save</button>
            </div>
        </form>
    </dialog>

    <script src="admin.js"></script>
</body>
</html>
